<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bankberater</title>
<style>
  :root {
    --bg: #fdfaf7; --fg: #2e2a26; --muted: #6b6259; --line: #e4dcd3;
    --accent: #b4573a; --card: #f5efe8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --fg: #e8e2db; --muted: #a49a90; --line: #3a342f;
      --accent: #e08461; --card: #262220;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 4rem 1.25rem 5rem;
    background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 2.1rem; margin: 0 0 .5rem; }
  .untertitel { color: var(--muted); margin: 0 0 2.5rem; }
  a.karte {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line);
    border-radius: .6rem; padding: 1.1rem 1.25rem; margin-bottom: .85rem;
  }
  a.karte:hover { border-color: var(--accent); }
  a.karte strong { color: var(--accent); display: block; margin-bottom: .2rem; }
  a.karte span { color: var(--muted); font-size: .93rem; }
  footer { margin-top: 3rem; color: var(--muted); font-size: .9rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>

<h1>Bankberater</h1>
<p class="untertitel">Öffentliche Sitzbänke finden, bewerten und teilen.</p>

<a class="karte" href="datenschutz.html">
  <strong>Datenschutzerklärung</strong>
  <span>Welche Daten anfallen, wer sie bekommt und wie du sie wieder loswirst.</span>
</a>

<a class="karte" href="konto-loeschen.html">
  <strong>Konto löschen</strong>
  <span>Anleitung für die App und für die Löschung per E-Mail.</span>
</a>

<footer>
  Fragen? <a href="mailto:bankberaterapp@gmail.com">bankberaterapp@gmail.com</a>
</footer>

</main>
</body>
</html>
